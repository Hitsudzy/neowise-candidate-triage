<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    pre { white-space: pre-wrap; margin: 0; padding: .5rem; background: #f4f4f4; border-radius: .25rem; }
    #notice { margin: 1rem 0; padding: .5rem .75rem; border-radius: .25rem; background: #eef2ff; }
    #notice[data-kind="manual"] { background: #fff4e5; border-left: 4px solid #e8890c; }
    #notice[data-kind="invalid"] { background: #fdecec; border-left: 4px solid #d93025; }
    #output { margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form novalidate>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <p id="notice" role="status" aria-live="polite" hidden></p>
  <section id="output" hidden>
    <p><strong>Тема:</strong> <span id="topic"></span></p>
    <p><strong>Черновик ответа</strong> (проверьте перед отправкой клиенту):</p>
    <pre id="draft"></pre>
  </section>
  <script type="module">
    import { toView, render, LOADING_VIEW } from "/ui.mjs";

    const form = document.querySelector("form");
    const input = document.querySelector("#message");
    const button = form.querySelector("button");
    const elements = {
      notice: document.querySelector("#notice"),
      output: document.querySelector("#output"),
      topic: document.querySelector("#topic"),
      draft: document.querySelector("#draft"),
    };
    let lastRequest = 0;

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const text = input.value;
      if (text.trim() === "") {
        render(elements, toView(400, { status: "invalid_input" }));
        input.focus();
        return;
      }

      const requestId = ++lastRequest;
      render(elements, LOADING_VIEW); // старый черновик убираем сразу, а не после ответа
      button.disabled = true;

      let view;
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
          signal: AbortSignal.timeout(5000),
        });
        view = toView(reply.status, await reply.json().catch(() => null));
      } catch {
        view = toView(0, null); // сеть упала или сервер не ответил — тоже ручной разбор
      }

      if (requestId !== lastRequest) return; // устаревший ответ не перетирает новый
      render(elements, view);
      button.disabled = false;
    });
  </script>
</body>
</html>
